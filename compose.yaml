
services:
  db:
    image: postgres:17
    container_name: evently-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evently
      POSTGRES_PASSWORD: evently_password
      POSTGRES_DB: evently
    ports:
      - "5433:5432"
    volumes:
      - evently_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evently -d evently"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  evently_pgdata:
    name: evently_pgdata
